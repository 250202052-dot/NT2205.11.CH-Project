server {
    listen 443 ssl;
    server_name tls-weak.topic4.lab;

    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2;
    # Deliberately weak lab profile: RSA key exchange, CBC mode, SHA-1 MAC,
    # no forward secrecy. SECLEVEL=0 is scoped to this isolated endpoint.
    ssl_ciphers AES128-SHA:@SECLEVEL=0;
    ssl_prefer_server_ciphers on;

    location / {
        default_type application/json;
        return 200 '{"service":"tls-server","profile":"weak","status":"ok"}\n';
    }
}
