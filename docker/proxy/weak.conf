server {
    listen 443 ssl;
    server_name proxy.topic4.lab;
    access_log off;
    error_log /dev/null crit;
    ssl_certificate /etc/nginx/tls/weak/server.crt;
    ssl_certificate_key /etc/nginx/tls/weak/server.key;
    ssl_protocols TLSv1.2;
    ssl_ciphers AES128-SHA:@SECLEVEL=0;
    add_header X-Lab-Profile weak always;
    location / { proxy_pass http://172.30.30.10:8080; }
}
